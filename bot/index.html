<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТАТУ ТУТ — открываем бота…</title>
<meta name="robots" content="noindex">
<!-- Хаб-редирект под нашим контролем. 07.08.2026 — ПОЧЕМУ ТАК:
     1) Хвост ?start= — привязка клиента к мастеру (tt_<токен>) и рекламные
        метки (ig25/th25/yt_dk). Терять его НЕЛЬЗЯ ни на одном пути.
     2) В РФ веб-домены t.me/telegram.me блокируются (подменённый сертификат)
        — in-app браузеры Instagram/Threads показывали «сертификат не является
        доверенным» и человек ТЕРЯЛСЯ. Поэтому основной путь теперь НАТИВНЫЙ
        tg://resolve — открывает приложение Telegram в обход веба и блокировок.
     3) Веб-ссылка остаётся ВИДИМОЙ кнопкой (десктоп/нет приложения). -->
<script>try{navigator.sendBeacon("https://worker-production-c1cb.up.railway.app/api/hit?src=bot")}catch(e){}</script>
<script>
  (function () {
    var qs = location.search || "";
    var m = qs.match(/[?&]start=([^&]+)/);
    var st = m ? m[1] : "";
    var native = "tg://resolve?domain=ta2_blockbot" + (st ? "&start=" + st : "");
    var web = "https://t.me/ta2_blockbot" + (st ? "?start=" + st : "");
    document.addEventListener("DOMContentLoaded", function () {
      var a = document.getElementById("app");
      var b = document.getElementById("web");
      if (a) a.href = native;
      if (b) b.href = web;
    });
    // Нативный переход: если Telegram установлен — откроется приложение.
    // Если нет — останется страница с двумя кнопками.
    location.replace(native);
  })();
</script>
</head>
<body style="margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0b0b0f;color:#ededf2;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center">
<div style="padding:24px;max-width:420px">
<p style="font-size:17px;margin:0 0 18px">Открываем бота ТАТУ ТУТ в приложении Telegram…</p>
<p style="margin:0 0 10px"><a id="app" style="display:inline-block;background:#c4f000;color:#0b1208;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:12px" href="tg://resolve?domain=ta2_blockbot">Открыть Telegram</a></p>
<p style="margin:0"><a id="web" style="color:#8ab4ff;font-size:14px" href="https://t.me/ta2_blockbot">Открыть в браузере (нужен VPN в РФ)</a></p>
</div>
</body>
</html>
